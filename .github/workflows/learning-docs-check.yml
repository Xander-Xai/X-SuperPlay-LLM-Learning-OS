name: Learning documentation QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate modules, statuses, local Markdown links
        run: python LLM-Training/tools/check_repo.py
  cpu-toy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-input torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Shift/Mask smoke and unit tests
        run: |
          python -c "import torch; print('CPU torch:', torch.__version__)"
          python LLM-Training/labs/toy_train.py
          python -m unittest discover -s LLM-Training/labs -p 'test_*.py' -v

# CPU teaching lab is tested in CI. Passing it does not demonstrate any GPU training.

