name: Learning documentation QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate modules, statuses, local Markdown links
        run: python LLM-Training/tools/check_repo.py
      - name: Validate demand routes, source IDs and file index
        run: python LLM-Training/tools/validate_learning_index.py
      - name: Validate pinned six-domain upstream atlas and typed relations
        run: python LLM-Training/tools/validate_atlas.py
      - name: Test six-domain atlas routing, sources, snapshot and negative cases
        run: python -m unittest discover -s LLM-Training/tools -p 'test_atlas.py' -v
      - name: Smoke-test full-stack source and need lookup
        run: |
          python LLM-Training/tools/route_atlas.py --topic A04
          python LLM-Training/tools/route_atlas.py --need N02
          python LLM-Training/tools/route_atlas.py --domain E
          python LLM-Training/tools/route_atlas.py --search RAG
          python LLM-Training/tools/route_atlas.py --relate A04
          python LLM-Training/tools/route_atlas.py --path A04 O02
      - name: Verify demand-index and source-to-module contracts
        run: python -m unittest discover -s LLM-Training/tools -p 'test_learning_index.py' -v
      - name: Test toy DPO/GRPO formulas and reward hacking
        run: |
          python LLM-Training/labs/preference-rl-math/alignment_math.py
          python -m unittest discover -s LLM-Training/labs/preference-rl-math -p 'test_*.py' -v
      - name: Test synthetic task evaluation denominators and failures
        run: |
          python LLM-Training/labs/task-evaluation/evaluate.py
          python -m unittest discover -s LLM-Training/labs/task-evaluation -p 'test_*.py' -v
      - name: Test synthetic tool gateway and run safe demo
        run: |
          python -m unittest discover -s LLM-Training/labs/synthetic-tool-gateway -p 'test_*.py' -v
          python LLM-Training/labs/synthetic-tool-gateway/run_demo.py
      - name: Smoke test demand router
        run: |
          python LLM-Training/tools/route_learning.py --id tool-calling
          python LLM-Training/tools/route_learning.py --search 延迟
          python LLM-Training/tools/route_learning.py --search QLoRA
          python LLM-Training/tools/route_learning.py --search 工具调用
          python LLM-Training/tools/route_learning.py --module M11
  cpu-toy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-input torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Shift/Mask smoke and unit tests
        run: |
          python -c "import torch; print('CPU torch:', torch.__version__)"
          python LLM-Training/labs/toy_train.py
          python -m unittest discover -s LLM-Training/labs -p 'test_*.py' -v

# CPU teaching lab is tested in CI. Passing it does not demonstrate any GPU training.

